name: one-time-theme-metrics-patch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path

          # ---------------- GraphGraphics.cs: OSC 11 background probing ----------------
          p = Path('Ui/GraphGraphics.cs')
          s = p.read_text(encoding='utf-8')

          old = '''    private static bool _sixelFailed;\n    private static ulong? _lastSixelSignature;\n'''
          new = '''    private static bool _sixelFailed;\n    private static ulong? _lastSixelSignature;\n    private static (byte R, byte G, byte B) _terminalBackground = (0, 0, 0);\n    private static DateTime _lastBackgroundProbeUtc = DateTime.MinValue;\n    private static readonly TimeSpan BackgroundProbeInterval = TimeSpan.FromSeconds(30);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        _sixelFailed = false;\n        _lastSixelSignature = null;\n        return true;\n'''
          new = '''        _sixelFailed = false;\n        _lastSixelSignature = null;\n        _terminalBackground = (0, 0, 0);\n        _lastBackgroundProbeUtc = DateTime.MinValue;\n        return true;\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    public static bool IsSixelFrameDirty(IReadOnlyList<SixelGraphPoint> points, SixelGraphFrame frame)\n    {\n        if (!UseSixel || points.Count < 2 || frame.PlotWidth < 1 || frame.PlotHeight < 1)\n            return false;\n\n        return _lastSixelSignature != ComputeSixelSignature(points, frame);\n    }\n\n    public static void BeginSynchronizedUpdate()\n'''
          new = '''    public static bool IsSixelFrameDirty(IReadOnlyList<SixelGraphPoint> points, SixelGraphFrame frame)\n    {\n        if (!UseSixel || points.Count < 2 || frame.PlotWidth < 1 || frame.PlotHeight < 1)\n            return false;\n\n        if (RefreshTerminalBackgroundIfDue())\n            _lastSixelSignature = null;\n\n        return _lastSixelSignature != ComputeSixelSignature(points, frame);\n    }\n\n    private static bool RefreshTerminalBackgroundIfDue()\n    {\n        if (!UseSixel || Console.IsInputRedirected || Console.IsOutputRedirected)\n            return false;\n\n        var now = DateTime.UtcNow;\n        if (now - _lastBackgroundProbeUtc < BackgroundProbeInterval)\n            return false;\n\n        // Set the attempt time before querying so an unsupported terminal costs at\n        // most one short timeout every 30 seconds rather than every render frame.\n        _lastBackgroundProbeUtc = now;\n        if (!TryQueryTerminalBackground(out var background))\n            return false;\n\n        if (background == _terminalBackground)\n            return false;\n\n        _terminalBackground = background;\n        return true;\n    }\n\n    private static bool TryQueryTerminalBackground(out (byte R, byte G, byte B) color)\n    {\n        color = default;\n        try\n        {\n            // OSC 11 asks for the terminal's default background color. A typical\n            // reply is ESC ] 11 ; rgb:0c0c/0c0c/0c0c ESC \\\\ .\n            if (Console.KeyAvailable)\n                return false;\n\n            Console.Write("\\u001b]11;?\\u0007");\n            Console.Out.Flush();\n\n            var response = new StringBuilder(96);\n            var stopwatch = Stopwatch.StartNew();\n            var started = false;\n            var previous = '\\0';\n\n            while (stopwatch.ElapsedMilliseconds < 140)\n            {\n                if (!Console.KeyAvailable)\n                {\n                    Thread.Sleep(2);\n                    continue;\n                }\n\n                var ch = Console.ReadKey(intercept: true).KeyChar;\n                if (!started)\n                {\n                    if (ch != '\\u001b')\n                        continue;\n                    started = true;\n                }\n\n                response.Append(ch);\n                if (ch == '\\u0007' || (previous == '\\u001b' && ch == '\\\\') || response.Length >= 95)\n                    break;\n                previous = ch;\n            }\n\n            return TryParseOsc11Background(response.ToString(), out color);\n        }\n        catch\n        {\n            return false;\n        }\n    }\n\n    private static bool TryParseOsc11Background(string response, out (byte R, byte G, byte B) color)\n    {\n        color = default;\n        const string marker = "]11;rgb:";\n        var markerAt = response.IndexOf(marker, StringComparison.OrdinalIgnoreCase);\n        if (markerAt < 0)\n            return false;\n\n        var start = markerAt + marker.Length;\n        var end = response.IndexOf('\\u0007', start);\n        var st = response.IndexOf("\\u001b\\\\", start, StringComparison.Ordinal);\n        if (end < 0 || (st >= 0 && st < end)) end = st;\n        if (end < 0) end = response.Length;\n\n        var parts = response[start..end].Split('/');\n        if (parts.Length != 3 ||\n            !TryParseOscColorComponent(parts[0], out var r) ||\n            !TryParseOscColorComponent(parts[1], out var g) ||\n            !TryParseOscColorComponent(parts[2], out var b))\n            return false;\n\n        color = (r, g, b);\n        return true;\n    }\n\n    private static bool TryParseOscColorComponent(string hex, out byte value)\n    {\n        value = 0;\n        hex = hex.Trim();\n        if (hex.Length is < 1 or > 4 ||\n            !uint.TryParse(hex, System.Globalization.NumberStyles.HexNumber,\n                System.Globalization.CultureInfo.InvariantCulture, out var parsed))\n            return false;\n\n        var max = (1u << (hex.Length * 4)) - 1u;\n        value = (byte)Math.Round(parsed * 255.0 / max, MidpointRounding.AwayFromZero);\n        return true;\n    }\n\n    public static void BeginSynchronizedUpdate()\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        try\n        {\n            var signature = ComputeSixelSignature(points, frame);\n'''
          new = '''        try\n        {\n            RefreshTerminalBackgroundIfDue();\n            var signature = ComputeSixelSignature(points, frame);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          s = s.replace('''            // Palette indexes:\n            // 0 black background, 1 cyan trace, 2 yellow current point,\n''', '''            // Palette indexes:\n            // 0 terminal default background, 1 cyan trace, 2 yellow current point,\n''', 1)

          old = '''            var payload = EncodeOpaqueSixel(pixels);\n'''
          new = '''            var payload = EncodeOpaqueSixel(pixels, _terminalBackground);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        Mix(cell.Width);\n        Mix(cell.Height);\n        Mix(points.Count);\n'''
          new = '''        Mix(cell.Width);\n        Mix(cell.Height);\n        Mix(_terminalBackground.R);\n        Mix(_terminalBackground.G);\n        Mix(_terminalBackground.B);\n        Mix(points.Count);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    private static string EncodeOpaqueSixel(byte[,] pixels)\n    {\n'''
          new = '''    private static string EncodeOpaqueSixel(byte[,] pixels, (byte R, byte G, byte B) background)\n    {\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        sb.Append("\\u001bP0;0;0q");             // P2=0: opaque replacement\n        sb.Append('"').Append("1;1;").Append(width).Append(';').Append(height);\n        sb.Append("#0;2;0;0;0");                // black background\n'''
          new = '''        sb.Append("\\u001bP0;0;0q");             // P2=0: opaque replacement\n        sb.Append('"').Append("1;1;").Append(width).Append(';').Append(height);\n        sb.Append("#0;2;")\n            .Append(ToSixelPercent(background.R)).Append(';')\n            .Append(ToSixelPercent(background.G)).Append(';')\n            .Append(ToSixelPercent(background.B)); // terminal background (OSC 11)\n'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''    private static void AppendRleSixels(StringBuilder sb, byte[] masks, int count)\n'''
          insert = '''    private static int ToSixelPercent(byte value) =>\n        (int)Math.Round(value * 100.0 / 255.0, MidpointRounding.AwayFromZero);\n\n'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s, encoding='utf-8')

          # ---------------- ResponsiveTuiApp.cs: graph metric toggle/history ----------------
          p = Path('Ui/ResponsiveTuiApp.cs')
          s = p.read_text(encoding='utf-8')

          marker = '''    private enum Screen\n    {\n        Dashboard,\n        Settings,\n        Remote,\n        History,\n        Info,\n        Advanced,\n        Help\n    }\n\n'''
          insert = marker + '''    private enum GraphMetric\n    {\n        Cpm,\n        Dose,\n        Battery\n    }\n\n'''
          assert marker in s
          s = s.replace(marker, insert, 1)

          old = '''        public Queue<int> CpmHistory { get; } = new();\n        public DeviceCapabilities Capabilities { get; set; } = DeviceCapabilities.Unknown;\n'''
          new = '''        public Queue<int> CpmHistory { get; } = new();\n        public Queue<int> VoltageHistoryMv { get; } = new();\n        public DeviceCapabilities Capabilities { get; set; } = DeviceCapabilities.Unknown;\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    private Screen _screen = Screen.Dashboard;\n    private int _settingIndex;\n'''
          new = '''    private Screen _screen = Screen.Dashboard;\n    private GraphMetric _graphMetric = GraphMetric.Cpm;\n    private int _settingIndex;\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        TryUpdate(() => _device.GetVoltage(), v => _snapshot.Voltage = v);\n'''
          new = '''        try\n        {\n            var voltage = _device.GetVoltage();\n            lock (_snapshotLock)\n            {\n                _snapshot.Voltage = voltage;\n                _snapshot.VoltageHistoryMv.Enqueue((int)Math.Round(voltage * 1000.0));\n                // One hour at the five-second slow-poll cadence.\n                while (_snapshot.VoltageHistoryMv.Count > 720)\n                    _snapshot.VoltageHistoryMv.Dequeue();\n            }\n        }\n        catch { }\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            case ConsoleKey.F1: _screen = Screen.Help; return true;\n            case ConsoleKey.M: ToggleSpeaker(); return true;\n'''
          new = '''            case ConsoleKey.F1: _screen = Screen.Help; return true;\n            case ConsoleKey.G when _screen == Screen.Dashboard: CycleGraphMetric(); return true;\n            case ConsoleKey.M: ToggleSpeaker(); return true;\n'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''    private void ToggleSpeaker()\n'''
          insert = '''    private void CycleGraphMetric()\n    {\n        _graphMetric = _graphMetric switch\n        {\n            GraphMetric.Cpm => GraphMetric.Dose,\n            GraphMetric.Dose => GraphMetric.Battery,\n            _ => GraphMetric.Cpm\n        };\n        GraphGraphics.InvalidateSixelOverlay();\n        Flash($"Graph: {_graphMetric switch { GraphMetric.Cpm => "CPM", GraphMetric.Dose => "dose (nSv/h)", _ => "battery (mV)" }}");\n    }\n\n'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)

          old = '''        x = WriteHotkey(c, x, y, "D", "Dashboard");\n        x = WriteHotkey(c, x, y, "S", "Settings");\n'''
          new = '''        x = WriteHotkey(c, x, y, "D", "Dashboard");\n        if (_screen == Screen.Dashboard && x < c.Width - 12) x = WriteHotkey(c, x, y, "G", "Graph");\n        x = WriteHotkey(c, x, y, "S", "Settings");\n'''
          assert old in s
          s = s.replace(old, new, 1)

          s = s.replace('''        DrawCpmGraph(c, 1, graphY, c.Width - 2, graphH, s.CpmHistory);\n''', '''        DrawSelectedGraph(c, 1, graphY, c.Width - 2, graphH, s);\n''', 1)
          s = s.replace('''            DrawCpmGraph(c, 1, row, c.Width - 2, graphH, s.CpmHistory);\n        else if (graphH >= 2)\n            DrawMiniGraph(c, 2, row, c.Width - 4, s.CpmHistory);\n''', '''            DrawSelectedGraph(c, 1, row, c.Width - 2, graphH, s);\n        else if (graphH >= 2)\n        {\n            var series = GetSelectedGraphSeries(s);\n            DrawMiniGraph(c, 2, row, c.Width - 4, series.Data, series.ShortLabel);\n        }\n''', 1)

          start = s.index('    private void DrawCpmGraph(')
          end = s.index('    private void DrawSettings(', start)
          graph_block = '''    private void DrawSelectedGraph(ConsoleCanvas c, int x, int y, int width, int height, SnapshotCopy snapshot)\n    {\n        var series = GetSelectedGraphSeries(snapshot);\n        DrawTrendGraph(c, x, y, width, height, series.Data, series.Title, series.ShortLabel, series.SecondsPerSample);\n    }\n\n    private (int[] Data, string Title, string ShortLabel, int SecondsPerSample) GetSelectedGraphSeries(SnapshotCopy snapshot)\n    {\n        switch (_graphMetric)\n        {\n            case GraphMetric.Dose:\n            {\n                if (snapshot.Config is null)\n                    return ([], "DOSE TREND · nSv/h", "Dose", 1);\n\n                var dose = new List<int>(snapshot.CpmHistory.Length);\n                foreach (var cpm in snapshot.CpmHistory)\n                {\n                    if (ConfigSettings.TryComputeDoseRate(snapshot.Config, cpm, out var uSv))\n                        dose.Add((int)Math.Round(uSv * 1000.0, MidpointRounding.AwayFromZero));\n                }\n                return (dose.ToArray(), "DOSE TREND · nSv/h", "Dose", 1);\n            }\n            case GraphMetric.Battery:\n                return (snapshot.VoltageHistoryMv, "BATTERY TREND · mV", "Battery", 5);\n            default:\n                return (snapshot.CpmHistory, "CPM TREND", "CPM", 1);\n        }\n    }\n\n    private static void DrawTrendGraph(ConsoleCanvas c, int x, int y, int width, int height,\n        IReadOnlyList<int> history, string title, string shortLabel, int secondsPerSample)\n    {\n        if (width < 24 || height < 6)\n        {\n            DrawMiniGraph(c, x, y, width, history, shortLabel);\n            return;\n        }\n\n        c.Box(x, y, width, height, ConsoleColor.DarkGray, title, ConsoleColor.Cyan);\n        var axisW = 7;\n        var plotX = x + axisW;\n        var plotY = y + 2;\n        var plotW = Math.Max(4, width - axisW - 2);\n        var plotH = Math.Max(2, height - 4);\n        var data = history.TakeLast(plotW).ToArray();\n\n        if (data.Length == 0)\n        {\n            c.Write(x + 3, y + 2, $"Waiting for {shortLabel.ToLowerInvariant()} samples...", ConsoleColor.DarkGray);\n            return;\n        }\n\n        var rawMin = data.Min();\n        var rawMax = data.Max();\n        var average = data.Average();\n        var current = data[^1];\n        var range = Math.Max(4, rawMax - rawMin);\n        var padding = Math.Max(1, (int)Math.Ceiling(range * 0.15));\n        var scaleMin = Math.Max(0, rawMin - padding);\n        var scaleMax = Math.Max(scaleMin + 4, rawMax + padding);\n\n        var stat = $"now {current}   min {rawMin}   avg {average:0.0}   max {rawMax}   {data.Length} samples";\n        c.WriteRight(x + width - 3, y, stat, ConsoleColor.Gray);\n\n        var topValue = scaleMax;\n        var midValue = (scaleMax + scaleMin) / 2;\n        var bottomValue = scaleMin;\n        DrawGridLine(c, plotX, plotY, plotW, topValue, ConsoleColor.DarkGray);\n        DrawGridLine(c, plotX, plotY + plotH / 2, plotW, midValue, ConsoleColor.DarkGray);\n        DrawGridLine(c, plotX, plotY + plotH - 1, plotW, bottomValue, ConsoleColor.DarkGray);\n\n        var avgY = ValueToRow(average, scaleMin, scaleMax, plotY, plotH);\n        for (var px = plotX; px < plotX + plotW; px += 2)\n            c.Put(px, avgY, '·', ConsoleColor.DarkYellow);\n\n        var firstX = plotX + Math.Max(0, plotW - data.Length);\n        int? previousX = null;\n        int? previousY = null;\n        for (var i = 0; i < data.Length; i++)\n        {\n            var px = firstX + i;\n            var py = ValueToRow(data[i], scaleMin, scaleMax, plotY, plotH);\n\n            if (previousX is int prevX && previousY is int prevY)\n                ConnectGraphPoints(c, prevX, prevY, px, py, ConsoleColor.Cyan);\n\n            c.Put(px, py, i == data.Length - 1 ? '●' : '•',\n                i == data.Length - 1 ? ConsoleColor.Yellow : ConsoleColor.Cyan);\n            previousX = px;\n            previousY = py;\n        }\n\n        var bottomY = y + height - 2;\n        var approxSeconds = Math.Max(secondsPerSample, data.Length * secondsPerSample);\n        c.Write(plotX, bottomY, approxSeconds < 90 ? $"~{approxSeconds}s ago" : $"~{approxSeconds / 60.0:0.0}m ago", ConsoleColor.DarkGray);\n        c.WriteRight(x + width - 3, bottomY, "now", ConsoleColor.DarkGray);\n        c.Write(plotX + Math.Max(1, plotW / 2 - 4), bottomY, $"avg {average:0.0}", ConsoleColor.DarkYellow);\n    }\n\n    private static void DrawGridLine(ConsoleCanvas c, int plotX, int y, int plotW, int value, ConsoleColor color)\n    {\n        c.WriteRight(plotX - 2, y, value.ToString(CultureInfo.InvariantCulture), ConsoleColor.DarkGray);\n        for (var px = plotX; px < plotX + plotW; px += 2)\n            c.Put(px, y, '·', color);\n    }\n\n    private static int ValueToRow(double value, int min, int max, int plotY, int plotH)\n    {\n        var fraction = (value - min) / Math.Max(1.0, max - min);\n        var offset = (int)Math.Round(fraction * (plotH - 1));\n        return plotY + plotH - 1 - Math.Clamp(offset, 0, plotH - 1);\n    }\n\n    private static void ConnectGraphPoints(ConsoleCanvas c, int x1, int y1, int x2, int y2, ConsoleColor color)\n    {\n        if (x2 <= x1) return;\n        var delta = y2 - y1;\n        if (delta == 0)\n        {\n            c.Put(x2, y2, '─', color);\n            return;\n        }\n\n        if (Math.Abs(delta) == 1)\n        {\n            c.Put(x2, y2, delta < 0 ? '╱' : '╲', color);\n            return;\n        }\n\n        var start = Math.Min(y1, y2) + 1;\n        var end = Math.Max(y1, y2);\n        for (var graphY = start; graphY < end; graphY++)\n            c.Put(x2, graphY, '│', color);\n        c.Put(x2, y2, delta < 0 ? '╱' : '╲', color);\n    }\n\n    private static void DrawMiniGraph(ConsoleCanvas c, int x, int y, int width, IReadOnlyList<int> history, string label)\n    {\n        var data = history.TakeLast(Math.Max(1, width - label.Length - 2)).ToArray();\n        if (data.Length == 0)\n        {\n            c.Write(x, y, $"{label} history: waiting for samples...", ConsoleColor.DarkGray);\n            return;\n        }\n\n        const string bars = "▁▂▃▄▅▆▇█";\n        var min = data.Min();\n        var max = data.Max();\n        c.Write(x, y, label + " ", ConsoleColor.Cyan);\n        var graphX = x + label.Length + 1;\n        for (var i = 0; i < data.Length && graphX + i < c.Width; i++)\n        {\n            var idx = max == min ? 3 : (int)Math.Round((data[i] - min) * (bars.Length - 1.0) / (max - min));\n            c.Put(graphX + i, y, bars[Math.Clamp(idx, 0, bars.Length - 1)], i == data.Length - 1 ? ConsoleColor.Yellow : ConsoleColor.Cyan);\n        }\n    }\n\n'''
          s = s[:start] + graph_block + s[end:]

          old = '''        DrawHelpRow(c, ref y, "X", "Advanced commands");\n        DrawHelpRow(c, ref y, "M", "Mute/unmute speaker clicks");\n'''
          new = '''        DrawHelpRow(c, ref y, "X", "Advanced commands");\n        DrawHelpRow(c, ref y, "G", "Cycle dashboard graph: CPM / dose / battery");\n        DrawHelpRow(c, ref y, "M", "Mute/unmute speaker clicks");\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        string Status,\n        int[] CpmHistory,\n        DeviceCapabilities Capabilities);\n'''
          new = '''        string Status,\n        int[] CpmHistory,\n        int[] VoltageHistoryMv,\n        DeviceCapabilities Capabilities);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                _snapshot.Status,\n                _snapshot.CpmHistory.ToArray(),\n                _snapshot.Capabilities);\n'''
          new = '''                _snapshot.Status,\n                _snapshot.CpmHistory.ToArray(),\n                _snapshot.VoltageHistoryMv.ToArray(),\n                _snapshot.Capabilities);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Build
        run: dotnet build -c Release
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ui/GraphGraphics.cs Ui/ResponsiveTuiApp.cs
          if ! git diff --cached --quiet; then
            git commit -m "Match Sixel background and add graph metric toggle"
            git push origin HEAD:main
          fi
